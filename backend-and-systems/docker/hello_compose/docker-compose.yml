services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis          # the service name below acts as a hostname
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data          # named volume: data survives container removal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  redisdata:
